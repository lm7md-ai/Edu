name: edu
description: Offline-first peer-to-peer study and interactive whiteboard tutor.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  meta: ^1.15.0
  collection: ^1.19.1
  crypto: ^3.0.6
  ffi: ^2.1.3
  path_provider: ^2.1.5
  sqlite3: ^2.7.0
  sqlite3_flutter_libs: ^0.5.28
  shelf: ^1.4.2
  shelf_web_socket: ^2.0.1
  web_socket_channel: ^3.0.1
  nsd: ^4.0.4
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  image: ^4.5.4
  flutter_math_fork: ^0.7.4
  perfect_freehand: ^2.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.5
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
  assets:
    - assets/grammar/whiteboard.gbnf
