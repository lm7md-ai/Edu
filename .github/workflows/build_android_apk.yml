name: Android APK CI and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Test and build arm64 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-${{ runner.os }}
          pub-cache: true

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test
        continue-on-error: true

      - name: Build hardened release APK
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/debug-info --android-skip-build-dependency-validation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: edu-tutor-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload obfuscation symbols
        uses: actions/upload-artifact@v4
        with:
          name: edu-tutor-release-debug-info
          path: build/debug-info/**
          if-no-files-found: warn
          retention-days: 90

      - name: Publish APK on a tagged GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edu-tutor-${{ github.run_number }}-${{ github.run_attempt }}
          target_commitish: ${{ github.sha }}
          name: Edu Tutor Android build ${{ github.run_number }}
          body: |
            Automated arm64 Android APK built from `${{ github.sha }}`.

            Download `app-release.apk` below and install it on a compatible Android device. Model weights and vendor inference backends are not included in the APK.
          files: build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
          make_latest: false
